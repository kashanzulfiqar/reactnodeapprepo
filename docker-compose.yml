version: '3.8'

services:
  # ==========================================
  # 1. BACKEND APPLICATION
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nodebackendimg:latest
    container_name: backend
    restart: always
    ports:
      - "80:5000"  # CloudFront origin traffic hits port 80 directly
    environment:
      - PORT=5000
    networks:
      - app-net

  # ==========================================
  # 2. DOCKER STATS EXPORTER (Container Metrics)
  # ==========================================
  docker-stats:
    image: wyveo/docker-stats-exporter:latest
    container_name: docker-stats
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9487:9487"
    networks:
      - app-net

  # ==========================================
  # 3. PROMETHEUS (Metrics Collector)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: always
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - docker-stats
    networks:
      - app-net

  # ==========================================
  # 4. GRAFANA (Visualization Dashboard)
  # ==========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

# ==========================================
# INLINE CONFIGURATIONS
# ==========================================
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 5s

      scrape_configs:
        - job_name: 'docker-stats'
          static_configs:
            - targets: ['docker-stats:9487']

  grafana_datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
