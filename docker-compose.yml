version: '3.8'

services:
  backend:
    build:
       context: ./backend
       dockerfile: Dockerfile
    image: kashan1234/nodebackendimg:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    image: kashan1234/reactfrontendimg:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
