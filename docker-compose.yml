services:
  # ==========================================
  # 0. NGINX REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 20M
    networks:
      - app-net

  # ==========================================
  # 1. BACKEND APPLICATION
  # ==========================================
  backend:
    image: kashan1234/my-backend:${IMAGE_TAG:-staging-latest}
    container_name: backend
    restart: unless-stopped
    ports:
      - "81:5000"
    environment:
      - PORT=5000
    #healthcheck:
     # test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1"]
      #interval: 10s
      #timeout: 5s
      #retries: 3
      #start_period: 10s
    deploy:
      resources:
        limits:
          memory: 250M
        reservations:
          memory: 100M
    networks:
      - app-net
    logging:
      driver: "loki"
      options:
        loki-url: "http://127.0.0.1:3100/loki/api/v1/push"
        loki-batch-size: "400"
        mode: "non-blocking"
        max-buffer-size: "4m"

  # ==========================================
  # 2. DOCKER STATS EXPORTER
  # ==========================================
  docker-stats:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker-stats
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9487:9487"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 20M
    networks:
      - app-net

  # ==========================================
  # 3. NODE EXPORTER
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 20M
    networks:
      - app-net

  # ==========================================
  # 4. PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2d'
      - '--storage.tsdb.retention.size=1GB'
      - '--storage.tsdb.wal-compression'
      - '--query.max-concurrency=2'
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 80M
    depends_on:
      - docker-stats
      - node-exporter
    networks:
      - app-net

  # ==========================================
  # 5. GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin} # Fallback added
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 180M
        reservations:
          memory: 80M
    depends_on:
      - prometheus
      - loki
    networks:
      - app-net

  # ==========================================
  # 6. LOKI
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 250M
        reservations:
          memory: 80M
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
