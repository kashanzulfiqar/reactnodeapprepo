version: '3.8'

services:
  # ==========================================
  # 1. BACKEND APPLICATION
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nodebackendimg:latest
    container_name: backend
    restart: always
    ports:
      - "80:5000"  # CloudFront origin traffic hits port 80 directly
    environment:
      - PORT=5000
    networks:
      - app-net

  # ==========================================
  # 2. DOCKER STATS EXPORTER (Container Metrics)
  # ==========================================
  docker-stats:
    image: wywywywy/docker_stats_exporter:latest
    container_name: docker-stats
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9487:9487"
    networks:
      - app-net

  # ==========================================
  # 3. NODE EXPORTER (EC2 Host Metrics)
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    ports:
      - "9100:9100"
    networks:
      - app-net

  # ==========================================
  # 4. PROMETHEUS (Metrics Collector)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: always
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - docker-stats
      - node-exporter
    networks:
      - app-net

  # ==========================================
  # 5. GRAFANA (Visualization Dashboard)
  # ==========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  # ==========================================
  # 5. loki (log database)
  # ==========================================  
loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 100M
# ==========================================
# INLINE CONFIGURATIONS
# ==========================================
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 5s

      scrape_configs:
        - job_name: 'docker-stats'
          static_configs:
            - targets: ['docker-stats:9487']

        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']

  grafana_datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
