version: '3.8'

services:
  # ==========================================
  # 1. BACKEND APPLICATION
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nodebackendimg:latest
    container_name: backend
    restart: always
    ports:
      - "80:5000"  # CloudFront origin traffic hits port 80 directly
    environment:
      - PORT=5000
    networks:
      - app-net

  # ==========================================
  # 2. CADVISOR (Container Metrics)
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - app-net

  # ==========================================
  # 3. PROMETHEUS (Metrics Collector)
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    restart: always
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-net

  # ==========================================
  # 4. GRAFANA (Visualization Dashboard)
  # ==========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

# ==========================================
# INLINE CONFIGURATIONS
# ==========================================
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s
        evaluation_interval: 5s

      scrape_configs:
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['cadvisor:8080']
