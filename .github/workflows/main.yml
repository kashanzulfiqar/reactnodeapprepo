name: Continuous Delivery Pipeline
 
on:
  push:
    branches: [ master ] # Triggers whenever code is merged to main

jobs:
  # ==========================================
  # STAGE 1: DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- 1. Apply Staging Infrastructure ---
      - name: Terraform Apply (Staging)
        run: |
          cd infra/environments/staging
          terraform init
          terraform apply -auto-approve

      # --- 2. Build & Deploy Staging Frontend (S3) ---
      - name: Build & Deploy Frontend to Staging S3
        run: |
          cd frontend
          npm install
          npm run build
          # REACT_APP_API_URL=https://staging-api.yourdomain.com npm run build
          aws s3 sync dist/ s3://kashan-my-app-frontend-staging --delete

      # --- 3. Deploy Staging Backend (EC2) ---
      - name: Deploy Backend to Staging EC2
        run: |
          echo "Deploying backend to Staging EC2 instance..."
          # Your SSH command, Docker pull, or deployment script here

  # ==========================================
  # STAGE 2: MANUAL APPROVAL & DEPLOY TO PROD
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging           # <--- Ensures Staging MUST finish first
    runs-on: self-hosted
    environment: production         # <--- TRIGGERS THE APPROVAL GATE!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- 1. Apply Production Infrastructure ---
      - name: Terraform Apply (Production)
        run: |
          cd infra/environments/prod
          terraform init
          terraform apply -auto-approve

      # --- 2. Build & Deploy Prod Frontend (S3 + CloudFront) ---
      - name: Build & Deploy Frontend to Prod S3
        run: |
          cd frontend
          npm install
          REACT_APP_API_URL=https://api.yourdomain.com npm run build
          aws s3 sync build/ s3://my-app-frontend-prod --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_CLOUDFRONT_DIST_ID }} --paths "/*"

      # --- 3. Deploy Prod Backend (EC2) ---
      - name: Deploy Backend to Prod EC2
        run: |
          echo "Deploying backend to Production EC2 instance..."
          # Your SSH command, Docker pull, or deployment script here
