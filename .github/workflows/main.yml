name: Continuous Delivery Pipeline
 
on: 
  push:
    branches: [ feature ] # Triggers whenever code is merged to main
 
jobs: 
  # ==========================================
  # STAGE 1: DEPLOY TO STAGING
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- 1. Apply Staging Infrastructure ---
      - name: Terraform Apply (Staging)
        run: |
          cd infra/environments/staging
          terraform init
          terraform apply -auto-approve
          EC2_IP=$(terraform output -raw staging_ec2_ip)
          echo "STAGING_EC2_IP=$EC2_IP" >> $GITHUB_ENV

      # --- 2. Build & Deploy Staging Frontend (S3) ---
      - name: Build & Deploy Frontend to Staging S3
        run: |
          cd frontend
          npm install
          npm run build
          # REACT_APP_API_URL=https://staging-api.yourdomain.com npm run build
          aws s3 sync dist/ s3://kashan-my-app-frontend-staging --delete

      # --- 3. Deploy Staging Backend (EC2) ---
      - name: Deploy Backend to Staging EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.STAGING_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.KEYFOREC2 }}
          script: |
            set -e
            echo "🚀 Deploying Backend to Staging EC2..."
            
            # 1. Install Docker & Docker Compose plugin if not present
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              
              # Add Docker official GPG key & repo
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
              # Allow ubuntu user to run Docker without sudo
              sudo usermod -aG docker ubuntu
            fi

            # 2. Clone or pull the repository
            if [ ! -d "$HOME/app" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/app
            fi

            cd $HOME/app
            git fetch --all
            git checkout master
            git pull origin master

            # 3. Navigate to backend and run Docker Compose
            cd $HOME/app/
            
            # Rebuild image and bring up container in detached mode (-d)
            sudo docker compose up -d --build

  # ==========================================
  # STAGE 2: MANUAL APPROVAL & DEPLOY TO PROD
  # ==========================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging           # <--- Ensures Staging MUST finish first
    runs-on: self-hosted
    environment: production         # <--- TRIGGERS THE APPROVAL GATE!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # --- 1. Apply Production Infrastructure ---
      - name: Terraform Apply (Production)
        run: |
          cd infra/environments/prod
          terraform init
          terraform apply -auto-approve

      # --- 2. Build & Deploy Prod Frontend (S3 + CloudFront) ---
      - name: Build & Deploy Frontend to Prod S3
        run: |
          cd frontend
          npm install
          REACT_APP_API_URL=https://api.yourdomain.com npm run build
          aws s3 sync build/ s3://my-app-frontend-prod --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_CLOUDFRONT_DIST_ID }} --paths "/*"

      # --- 3. Deploy Prod Backend (EC2) ---
      - name: Deploy Backend to Prod EC2
        run: |
          echo "Deploying backend to Production EC2 instance..."
          # Your SSH command, Docker pull, or deployment script here
