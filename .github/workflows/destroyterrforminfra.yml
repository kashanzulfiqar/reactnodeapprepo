name: "Direct Destroy via S3 State"

on:
  workflow_dispatch: # Triggers manually only

jobs:
  destroy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Fetch State File from S3
        run: |
          aws s3 cp s3://kashan-stagingtfstate-storage-2026/staging/terraform.tfstate ./terraform.tfstate

      - name: Generate Minimal Provider Config
        run: |
          cat << 'EOF' > main.tf
          terraform {
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
            }
          }
          provider "aws" {
            region = "us-east-1"
          }
          EOF

      - name: Initialize Local Terraform
        run: terraform init

      - name: Destroy Resources Using State
        run: terraform destroy -state=terraform.tfstate -auto-approve -input=false
