apiVersion: 1

contactPoints:
  - orgId: 1
    name: Slack Alerts
    receivers:
      - uid: slack-notifier
        type: slack
        settings:
          # Using url mode for Slack Incoming Webhooks
          url: "${SLACK_WEBHOOK_URL}"
          recipient: "#daftarproupdatesmonitoring"
          username: "Grafana"
          mentionChannel: "here"
          # Adding a token placeholder prevents Grafana's parser from failing validation
          token: ""
