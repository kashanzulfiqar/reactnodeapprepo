apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: high-memory-usage-rule
        title: High System Memory Usage
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            model:
              expr: '(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100'
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: threshold
        annotations:
          summary: "High Memory Usage Alert"
          description: "Host node-exporter:9100 has exceeded 85% RAM utilization."
        labels:
          severity: critical
